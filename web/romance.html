<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>恋爱校园 - 动漫萌新入坑指南</title>
    <style>
        body { margin: 0; padding: 40px 0; font-family: 'Microsoft YaHei'; background: #fff0f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .frame { background: white; width: 85%; max-width: 850px; padding: 20px; border-radius: 15px; box-shadow: 15px 15px 0 rgba(255,105,180,0.3); text-align: center; }
        .img-wrapper { width: 100%; aspect-ratio: 16 / 9; background: #ffe4e1; border-radius: 10px; overflow: hidden; }
        .img-wrapper img { width: 100%; height: 100%; object-fit: contain; display: block; }
        .content { padding: 30px 20px 10px 20px; }
        h1 { color: #ff69b4; font-size: 36px; margin-top: 0; margin-bottom: 20px; }
        p { color: #555; line-height: 1.8; font-size: 18px; margin-bottom: 10px; }
        .btn { display: inline-block; margin-top: 20px; background: #ff69b4; color: white; text-decoration: none; padding: 12px 35px; border-radius: 30px; font-weight: bold; box-shadow: 0 5px 15px rgba(255,105,180,0.4); transition: 0.3s; }
        .btn:hover { background: #e91e63; transform: translateY(-3px); }
    </style>
</head>
<body>
    <div class="frame">
        <div class="img-wrapper">
            <img src="../image/4.jpg" alt="辉夜大小姐">
        </div>
        <div class="content">
            <h1>恋爱校园</h1>
            <p>围绕学校生活和爱情故事，充满酸酸甜甜的狗粮。</p>
            <p><strong>代表作：</strong>《辉夜大小姐想让我告白》</p>
            <a href="../index.html" class="btn">← 返回主页</a>
        </div>
    </div>
</body>
</html>
