<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>治愈日常 - 动漫萌新入坑指南</title>
    <style>
        body { margin: 0; padding: 40px 0; font-family: 'Microsoft YaHei'; background: #e8f5e9; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .card { background: white; width: 85%; max-width: 800px; border-radius: 20px; overflow: hidden; box-shadow: 0 15px 30px rgba(0,0,0,0.1); text-align: center; }
        .img-wrapper { width: 100%; aspect-ratio: 16 / 9; background: #dcedc8; }
        .img-wrapper img { width: 100%; height: 100%; object-fit: contain; display: block; }
        .content { padding: 40px; }
        h1 { color: #4caf50; font-size: 36px; margin-top: 0; margin-bottom: 20px; }
        p { color: #666; line-height: 1.8; font-size: 18px; margin-bottom: 10px; }
        .btn { display: inline-block; margin-top: 25px; background: #4caf50; color: white; text-decoration: none; padding: 12px 35px; border-radius: 30px; font-weight: bold; transition: 0.3s; }
        .btn:hover { background: #388e3c; transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="card">
        <div class="img-wrapper">
            <img src="../image/2.jpg" alt="夏目友人帐">
        </div>
        <div class="content">
            <h1>治愈日常</h1>
            <p>节奏慢，温馨放松。在忙碌的现实生活后，这些番剧像一杯热茶，温暖你的心房。</p>
            <p><strong>代表作：</strong>《夏目友人帐》</p>
            <a href="../index.html" class="btn">← 返回主页</a>
        </div>
    </div>
</body>
</html>
